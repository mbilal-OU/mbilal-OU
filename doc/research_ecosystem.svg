<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Bilal research and software ecosystem</title>
  <desc id="desc">A visual map connecting microbial genome curation, species delineation, pangenome analysis, ordination, and deep-time phylogenomics, with supporting pangenome openness and HPC training projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef4f3"/>
    </linearGradient>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#17233f"/>
      <stop offset="1" stop-color="#284d55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#152238" flood-opacity="0.11"/>
    </filter>
    <style>
      .txt{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#17233f}
      .title{font-size:43px;font-weight:760}
      .subtitle{font-size:20px;fill:#dce8e9}
      .cardTitle{font-size:24px;font-weight:720}
      .body{font-size:17px;fill:#4a5872}
      .small{font-size:14px;fill:#65718a}
      .repo{font-size:16px;font-weight:700}
      .arrow{stroke:#8793a7;stroke-width:3.2;fill:none}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8793a7"/>
    </marker>
  </defs>

  <rect width="1600" height="700" rx="28" fill="url(#bg)"/>
  <rect x="34" y="28" width="1532" height="112" rx="26" fill="url(#header)"/>
  <text x="72" y="78" class="txt title" fill="#ffffff">From microbial genomes to evolutionary history</text>
  <text x="73" y="112" class="txt subtitle">Research questions, reusable software, and reproducible analysis across scales</text>

  <!-- connectors -->
  <path d="M322 350 C350 350 363 350 391 350" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M613 350 C641 350 655 350 683 350" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M905 350 C933 350 947 350 975 350" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M1197 350 C1225 350 1239 350 1267 350" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- card 1 -->
  <g filter="url(#shadow)"><rect x="68" y="208" width="254" height="282" rx="24" fill="#ffffff" stroke="#cbd7e4" stroke-width="2"/></g>
  <circle cx="108" cy="252" r="19" fill="#2a7886"/>
  <path d="M100 252 h16 M108 244 v16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="139" y="260" class="txt cardTitle">Genome cohorts</text>
  <text x="92" y="304" class="txt body">Acquire, reconcile,</text>
  <text x="92" y="330" class="txt body">inspect, and quality-filter</text>
  <text x="92" y="356" class="txt body">microbial assemblies.</text>
  <rect x="92" y="398" width="174" height="38" rx="19" fill="#e6f3f4"/>
  <text x="179" y="423" text-anchor="middle" class="txt repo" fill="#22636e">PanGenFlow</text>
  <text x="92" y="464" class="txt small">NCBI datasets · metadata · QC</text>

  <!-- card 2 -->
  <g filter="url(#shadow)"><rect x="391" y="208" width="222" height="282" rx="24" fill="#ffffff" stroke="#d6d3e8" stroke-width="2"/></g>
  <circle cx="431" cy="252" r="19" fill="#7557a6"/>
  <path d="M422 252 l7 7 12 -14" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="462" y="260" class="txt cardTitle">Species evidence</text>
  <text x="415" y="304" class="txt body">Compare ANI, alignment</text>
  <text x="415" y="330" class="txt body">fraction, taxonomy, and</text>
  <text x="415" y="356" class="txt body">phylogenomic context.</text>
  <rect x="415" y="398" width="174" height="38" rx="19" fill="#f0ebf8"/>
  <text x="502" y="423" text-anchor="middle" class="txt repo" fill="#62458f">SpeciesResolve</text>
  <text x="415" y="464" class="txt small">evidence-aware delineation</text>

  <!-- card 3 -->
  <g filter="url(#shadow)"><rect x="683" y="208" width="222" height="282" rx="24" fill="#ffffff" stroke="#ead8bd" stroke-width="2"/></g>
  <circle cx="723" cy="252" r="19" fill="#c5852c"/>
  <circle cx="716" cy="249" r="4" fill="#ffffff"/><circle cx="731" cy="244" r="4" fill="#ffffff"/><circle cx="728" cy="260" r="4" fill="#ffffff"/>
  <path d="M716 249 L731 244 L728 260 Z" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="754" y="260" class="txt cardTitle">Pangenomes</text>
  <text x="707" y="304" class="txt body">Resolve core and accessory</text>
  <text x="707" y="330" class="txt body">gene content and build</text>
  <text x="707" y="356" class="txt body">core-genome phylogenies.</text>
  <rect x="707" y="398" width="174" height="38" rx="19" fill="#fff3df"/>
  <text x="794" y="423" text-anchor="middle" class="txt repo" fill="#9d681f">PanPhyloFlow</text>
  <text x="707" y="464" class="txt small">Roary · Panaroo · IQ-TREE</text>

  <!-- card 4 -->
  <g filter="url(#shadow)"><rect x="975" y="208" width="222" height="282" rx="24" fill="#ffffff" stroke="#d2e3dd" stroke-width="2"/></g>
  <circle cx="1015" cy="252" r="19" fill="#3b9277"/>
  <circle cx="1008" cy="247" r="3.5" fill="#ffffff"/><circle cx="1021" cy="255" r="3.5" fill="#ffffff"/><circle cx="1010" cy="261" r="3.5" fill="#ffffff"/>
  <text x="1046" y="260" class="txt cardTitle">Gene-content space</text>
  <text x="999" y="304" class="txt body">Explore structure, outliers,</text>
  <text x="999" y="330" class="txt body">metadata patterns, and</text>
  <text x="999" y="356" class="txt body">candidate gene drivers.</text>
  <rect x="999" y="398" width="174" height="38" rx="19" fill="#e8f4ef"/>
  <text x="1086" y="423" text-anchor="middle" class="txt repo" fill="#2e755f">PanOrd</text>
  <text x="999" y="464" class="txt small">PCA · Jaccard PCoA · loadings</text>

  <!-- card 5 -->
  <g filter="url(#shadow)"><rect x="1267" y="208" width="265" height="282" rx="24" fill="#ffffff" stroke="#d6dbe6" stroke-width="2"/></g>
  <circle cx="1307" cy="252" r="19" fill="#3e557c"/>
  <path d="M1300 263 C1300 246 1305 239 1313 231 M1307 251 C1316 249 1321 245 1325 239 M1305 248 C1297 244 1293 239 1290 234" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="1338" y="260" class="txt cardTitle">Deep time</text>
  <text x="1291" y="304" class="txt body">Connect population-scale</text>
  <text x="1291" y="330" class="txt body">genome variation with</text>
  <text x="1291" y="356" class="txt body">phylogeny and divergence time.</text>
  <rect x="1291" y="398" width="214" height="38" rx="19" fill="#edf0f6"/>
  <text x="1398" y="423" text-anchor="middle" class="txt repo" fill="#33496e">Tree of Life research</text>
  <text x="1291" y="464" class="txt small">molecular clocks · astrobiology</text>

  <!-- support strip -->
  <rect x="68" y="545" width="1464" height="102" rx="24" fill="#17233f"/>
  <text x="98" y="581" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Supporting projects</text>
  <rect x="98" y="598" width="325" height="32" rx="16" fill="#2a3d61"/>
  <text x="260" y="620" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#f1f5fb">PanGenome Openness Estimator</text>
  <rect x="452" y="598" width="260" height="32" rx="16" fill="#2a3d61"/>
  <text x="582" y="620" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#f1f5fb">roary-pangenome-heatmaps</text>
  <rect x="741" y="598" width="220" height="32" rx="16" fill="#2a3d61"/>
  <text x="851" y="620" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#f1f5fb">FORGE Slurm Lab</text>
  <rect x="990" y="598" width="220" height="32" rx="16" fill="#2a3d61"/>
  <text x="1100" y="620" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#f1f5fb">BLab Slurm Builder</text>
  <text x="1499" y="620" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#bfc9da">reproducibility · HPC · teaching</text>
</svg>
