  <circle cx="1235" cy="76" r="4" fill="#0b2f5b"/>

  <text x="800" y="102" text-anchor="middle" class="serif title">Muhammad Bilal</text>
  <text x="800" y="145" text-anchor="middle" class="serif subtitle">Microbial Evolutionary Genomics</text>
  <line x1="665" y1="174" x2="760" y2="174" stroke="#8aa0bb" stroke-width="1.7"/>
  <line x1="840" y1="174" x2="935" y2="174" stroke="#8aa0bb" stroke-width="1.7"/>
