<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Bilal microbial evolutionary genomics research ecosystem</title>
  <desc id="desc">A five-stage visual connecting genome cohort curation, species evidence, pangenome reconstruction, gene-content structure, and deep-time evolutionary research, with supporting software projects.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </linearGradient>
    <linearGradient id="navyTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2f5b"/>
      <stop offset="1" stop-color="#13838b"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf4fb"/>
      <stop offset="1" stop-color="#f9fcff"/>
    </linearGradient>
    <linearGradient id="softTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf7f7"/>
      <stop offset="1" stop-color="#f9fdfd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b2f5b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#0b2f5b"/>
    </marker>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
      .title{font-size:62px;font-weight:700;fill:#0b2f5b}
      .subtitle{font-size:34px;font-weight:650;fill:#0d6e78}
      .tag{font-size:18px;font-style:italic;fill:#40516f}
      .cardTitle{font-size:25px;font-weight:750;fill:#0b2f5b}
      .cardTitleTeal{font-size:25px;font-weight:750;fill:#0d6e78}
      .body{font-size:16px;fill:#233654}
      .repo{font-size:18px;font-weight:750;fill:#ffffff}
      .small{font-size:14px;fill:#5d6b82}
      .supportTitle{font-size:20px;font-weight:750;fill:#0b2f5b}
      .supportText{font-size:15px;fill:#233654}
    </style>
  </defs>

  <rect width="1600" height="900" rx="26" fill="url(#page)"/>

